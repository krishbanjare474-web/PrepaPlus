  function shuffle(arr){
    for(let i = arr.length - 1; i > 0; i--){
        let j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
}

questions.forEach(q => shuffle(q.o));
function loadQuestions(){

let quiz=document.getElementById("quiz");
quiz.innerHTML="";

questions.forEach((item,index)=>{

quiz.innerHTML+=`

<div class="question-card">  
<h3>${index + 1}. ${item.q}</h3></h3>  <label><input type="radio" name="q${index}" value="${item.o[0]}"> ${item.o[0]}</label><br>

<label><input type="radio" name="q${index}" value="${item.o[1]}"> ${item.o[1]}</label><br>

<label><input type="radio" name="q${index}" value="${item.o[2]}"> ${item.o[2]}</label><br>

<label><input type="radio" name="q${index}" value="${item.o[3]}"> ${item.o[3]}</label><br>

<div id="ans${index}"></div>  </div>`;  
}); 

}

loadQuestions();

function checkResult(){

let score=0;

questions.forEach((item,index)=>{

let selected=document.querySelector(`input[name="q${index}"]:checked`);
let ans=document.getElementById("ans"+index);

ans.innerHTML="";

document.querySelectorAll(`input[name="q${index}"]`).forEach(r=>{

let label=r.parentElement;

label.classList.remove("correct","wrong");

if(r.value===item.a){
label.classList.add("correct");
label.innerHTML=label.innerHTML+" ✔️";
}

if(selected && r.checked && r.value!==item.a){
label.classList.add("wrong");
label.innerHTML=label.innerHTML+" ❌";
}

});

if(selected && selected.value===item.a){
score++;
}

ans.innerHTML=`<p class="correct">सही उत्तर: ✔️ ${item.a}</p>`;

});

document.getElementById("result").innerHTML=
`🎉 आपका Score: ${score} / ${questions.length}`;

}
