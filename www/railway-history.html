</label><br>

</label><br>

${item.o[3]}
</label>

</div>

`;

function checkResult() {

let score = 0;

document.querySelectorAll(".question-card").forEach((card, index) => {

let selected = card.querySelector("input[type='radio']:checked");
let labels = card.querySelectorAll("label");

labels.forEach(label => {
label.style.background = "";
label.style.color = "";
});

labels.forEach(label => {

let input = label.querySelector("input");

if(input.value === questions[index].a){
label.style.background = "#d4edda";
label.style.color = "green";
}

if(selected && input.checked && input.value !== questions[index].a){
label.style.background = "#f8d7da";
label.style.color = "red";
}

});

if(selected && selected.value === questions[index].a){
score++;
}

});

document.getElementById("result").innerHTML =
`<h2>🎉 Test Completed!</h2>
<h3>आपका Score: ${score} / ${questions.length}</h3>`;
}
