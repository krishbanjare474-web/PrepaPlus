    card.className = "question-card";

    let optionsHTML = "";

    item.o.forEach((option, optionIndex) => {

/* =========================
   CHECK RESULT
========================= */

submitButton.addEventListener("click", function () {

    let score = 0;

    questions.forEach((item, index) => {

        const selected = document.querySelector(
            `input[name="q${index}"]:checked`
        );

        const result = document.getElementById(`result${index}`);

        if (!selected) {

            result.innerHTML = "⚠️ Answer not selected";
            result.style.color = "orange";

        } else {

            const answer = Number(selected.value);

            if (answer === item.a) {

                score++;

                result.innerHTML = "✅ Correct";

                result.style.color = "green";

            } else {

                result.innerHTML =
                    `❌ Wrong — Correct Answer: ${item.o[item.a]}`;

                result.style.color = "red";
            }
        }
    });


    const total = questions.length;

    alert(
        `🎉 Test Completed!\n\nYour Score: ${score} / ${total}`
    );

});

/* =========================
   SHOW QUESTIONS
========================= */

const questionBox = document.getElementById("questions");

questions.forEach((item, index) => {

    const card = document.createElement("div");
    card.className = "question-card";

    let optionsHTML = "";

    item.o.forEach((option, optionIndex) => {
        optionsHTML += `
            <label>
                <input type="radio" name="q${index}" value="${optionIndex}">
                ${option}
            </label>
        `;
    });

    card.innerHTML = `
        <h3>Q${index + 1}. ${item.q}</h3>
        <p>${item.e}</p>

        <div class="options">
            ${optionsHTML}
        </div>

        <div class="answer-result" id="result${index}"></div>
    `;

    questionBox.appendChild(card);
});


/* =========================
   SUBMIT BUTTON
========================= */

const submitButton = document.createElement("button");

submitButton.textContent = "✅ Submit & Check Result";

submitButton.style.display = "block";
submitButton.style.margin = "25px auto";
submitButton.style.padding = "12px 25px";
submitButton.style.border = "none";
submitButton.style.borderRadius = "8px";
submitButton.style.background = "#2563eb";
submitButton.style.color = "white";
submitButton.style.fontSize = "16px";
submitButton.style.cursor = "pointer";

questionBox.after(submitButton);


/* =========================
   CHECK RESULT
========================= */

submitButton.addEventListener("click", function () {

    let score = 0;

    questions.forEach((item, index) => {

        const selected = document.querySelector(
            `input[name="q${index}"]:checked`
        );

        const result = document.getElementById(`result${index}`);

        if (!selected) {

            result.innerHTML = "⚠️ Answer not selected";
            result.style.color = "orange";

        } else {

            const answer = Number(selected.value);

            if (answer === item.a) {

                score++;

                result.innerHTML = "✅ Correct";

                result.style.color = "green";

            } else {

                result.innerHTML =
                    `❌ Wrong — Correct Answer: ${item.o[item.a]}`;

                result.style.color = "red";
            }
        }
    });


    const total = questions.length;

    alert(
        `🎉 Test Completed!\n\nYour Score: ${score} / ${total}`
    );

});
  </script>
