function checkResult(){

let score = 0;
let correct = [];
let wrong = [];


questions.forEach((item,index)=>{

let selected = document.querySelector(
`input[name="q${index}"]:checked`
);


if(selected && selected.value === item.a){

score++;
correct.push(index+1);

}
else{

wrong.push(index+1);

}

});
