<!DOCTYPE html>
<html lang="hi">

    <link rel="stylesheet" href="style.css">

<body>

    <!-- Main Content -->

                type="button"
                onclick="checkResult()">

            </button>


            <!-- Result -->
            <div id="result"></div>

        </section>

    </main>


    <!-- Footer -->
    <footer>

        <p>
            © 2026 PrepaPlus
        </p>

        <p>
            Railway Current Affairs Practice
