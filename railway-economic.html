function shuffle(arr){
    for(let i = arr.length - 1; i > 0; i--){
        let j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
}

questions.forEach(q => shuffle(q.o));

function loadQuestions(){

let quiz = document.getElementById("quiz");
quiz.innerHTML = "";

questions.forEach((item,index)=>{

quiz.innerHTML += `
<div class="question-card">

<h3>${index+1}. ${item.q}</h3>

${item.o.map(opt=>`
<label>
<input type="radio" name="q${index}" value="${opt}">
${opt}
</label><br>
`).join("")}

<div id="ans${index}"></div>

</div>`;
});

}

loadQuestions();

function checkResult(){

let score = 0;
let correct = [];
let wrong = [];

questions.forEach((item,index)=>{

let selected = document.querySelector(`input[name="q${index}"]:checked`);
let ans = document.getElementById("ans"+index);

if(selected && selected.value===item.a){

score++;
correct.push(index+1);

ans.innerHTML = `<p class="correct">✅ सही उत्तर: ${item.a}</p>`;

}else{

wrong.push(index+1);

ans.innerHTML = `<p class="wrong">❌ सही उत्तर: ${item.a}</p>`;

}

});

document.getElementById("result").innerHTML =
`🎉 आपका Score: ${score} / ${questions.length}<br><br>
✅ सही प्रश्न: ${correct.join(", ")}<br><br>
❌ गलत प्रश्न: ${wrong.join(", ")}`;

}
