const questionBox = document.getElementById("questions");

questions.forEach((item, index) => {

    let html = `
        <div class="question">
            <h3>${item.q}</h3>
    `;

    const letters = ["a","b","c","d"];

    item.o.forEach((option, i) => {

        html += `
            <label>
                <input type="radio" name="q${index}" value="${letters[i]}">
                ${letters[i].toUpperCase()}. ${option}
            </label>
        `;

    });

    html += `</div>`;

    questionBox.innerHTML += html;

});

function checkResult() {

    let score = 0;
    let correct = [];
    let wrong = [];
    let unattempted = [];

    questions.forEach((item, index) => {

        const selected = document.querySelector(
            'input[name="q' + index + '"]:checked'
        );

        if (!selected) {
            unattempted.push(index + 1);

        } else if (selected.value === item.a) {
            score++;
            correct.push(index + 1);

        } else {
            wrong.push(index + 1);
        }
    });

    const total = questions.length;
    const percentage = ((score / total) * 100).toFixed(2);

    let resultHTML = `
        <div class="result-box">
            <h2>🎉 Test Completed!</h2>

            <h3>🏆 Score: ${score} / ${total}</h3>
            <p>📊 Percentage: <b>${percentage}%</b></p>

            <p>✅ सही: <b>${correct.length}</b></p>
            <p>❌ गलत: <b>${wrong.length}</b></p>
            <p>⏭️ Unattempted: <b>${unattempted.length}</b></p>

            <hr>

            <h3>✅ सही Questions</h3>
            <p>${correct.length ? correct.join(", ") : "कोई नहीं"}</p>

            <h3>❌ गलत Questions</h3>
            <p>${wrong.length ? wrong.join(", ") : "कोई नहीं"}</p>

            <h3>⏭️ Unattempted Questions</h3>
            <p>${unattempted.length ? unattempted.join(", ") : "कोई नहीं"}</p>

            <br>

            <button onclick="location.reload()">
                🔄 Test दोबारा दें
            </button>
        </div>
    `;

    document.getElementById("result").innerHTML = resultHTML;
}
