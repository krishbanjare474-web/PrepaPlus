  function loadQuestions() {

let quiz = document.getElementById("quiz");

questions.forEach((item, index) => {

quiz.innerHTML += `

<div class="question-card">

<h3>${item.q}</h3>

<label><input type="radio" name="q${index}" value="${item.o[0]}"> ${item.o[0]}</label>

<label><input type="radio" name="q${index}" value="${item.o[1]}"> ${item.o[1]}</label>

<label><input type="radio" name="q${index}" value="${item.o[2]}"> ${item.o[2]}</label>

<label><input type="radio" name="q${index}" value="${item.o[3]}"> ${item.o[3]}</label>

</div>

`;

});

}

loadQuestions();
function checkResult() {

let score = 0;
let correct = [];
let wrong = [];

let cards = document.querySelectorAll(".question-card");

cards.forEach(function(card, index){

let labels = card.querySelectorAll("label");
let selected = card.querySelector("input[type='radio']:checked");

labels.forEach(function(label){

label.style.color = "black";
label.innerHTML = label.innerHTML.replace(" ✅","").replace(" ❌","");

let input = label.querySelector("input");

if(input.value === questions[index].a){
label.style.color = "green";
label.innerHTML += " ✅";
}

});

if(selected){

if(selected.value === questions[index].a){

score++;
correct.push(index+1);

}else{

selected.parentElement.style.color = "red";
selected.parentElement.innerHTML += " ❌";

wrong.push(index+1);

}

}else{

wrong.push(index+1);

}

});

document.getElementById("result").innerHTML =
`🎉 आपका Score: <b>${score} / ${questions.length}</b><br><br>
✅ सही प्रश्न: ${correct.length ? correct.join(", ") : "कोई नहीं"}<br><br>
❌ गलत प्रश्न: ${wrong.length ? wrong.join(", ") : "कोई नहीं"}`;

}
  
</script>
